<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>弦库 · 封面漫游</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#101119;color:#f6f2ed}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,a,input{font:inherit}button,a{color:inherit}button{cursor:pointer}
.shell{height:100dvh;min-height:620px;display:grid;grid-template-rows:64px 64px minmax(300px,1fr);max-width:1800px;margin:auto;padding:14px 36px 18px}
header{display:flex;justify-content:space-between;align-items:center;gap:20px}header a{text-decoration:none;color:#c9c3d2;font-size:13px}.brand{font-size:18px;font-weight:650;letter-spacing:2px}.top-nav{display:flex;align-items:center;gap:28px}.top-nav a{padding:10px 0;border-bottom:2px solid #f5d1a9;color:#f5d1a9}.workbench-link{display:flex;align-items:center;gap:8px;padding:10px 15px;border:1px solid #49434f;border-radius:8px}.workbench-link:hover{background:#24212c}.workbench-link svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.toolbar{display:flex;align-items:center;gap:7px;padding:24px 0 15px;flex-wrap:wrap}.toolbar button,.utility{background:transparent;border:1px solid #393842;border-radius:8px;padding:8px 16px;color:#bcb6c6;font-size:13px}.toolbar button[aria-pressed=true]{background:#f5d1a9;border-color:#f5d1a9;color:#30231b}.spacer{flex:1}.note{font-size:12px;color:#a29aa9}
#stage{min-height:300px;position:relative;overflow:hidden;border-radius:16px;background:#101119}
#status{position:absolute;inset:0;display:grid;place-content:center;pointer-events:none;color:#aca2b8;font-size:14px;z-index:2}
.selection{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:3px 0 18px}
.song{grid-column:2;display:flex;gap:12px;align-items:center;min-width:0;text-decoration:none;color:inherit}.song:hover h1{color:#f5d1a9}.song img{width:44px;height:44px;object-fit:cover;border-radius:6px}.song h1{font-size:24px;margin:0 0 5px;font-weight:650;line-height:1.3;overflow-wrap:anywhere}.song p{font-size:13px;color:#aca4b5;margin:0}.action{justify-self:end;background:#f5d1a9;color:#30231b;padding:12px 22px;border-radius:9px;text-decoration:none;font-size:14px;font-weight:650;white-space:nowrap}.action:hover{background:#ffe0bd}
button:focus-visible,a:focus-visible{outline:2px solid #f5d1a9;outline-offset:4px}
@media(max-width:650px){.shell{padding:18px 14px;min-height:560px}.top-nav{gap:14px}.workbench-link{padding:9px 10px;font-size:12px}.toolbar{padding-top:18px}.toolbar button{padding:8px 11px}.note{display:none}.selection{grid-template-columns:minmax(0,1fr) auto;gap:12px;padding-bottom:14px}.song{grid-column:1}.song h1{font-size:19px}.song img{width:38px;height:38px}.action{padding:11px 14px}}

.shell{position:relative}header{position:relative;z-index:8}.brand{display:flex;align-items:center;gap:16px;white-space:nowrap}.brand span{font-size:12px;color:#a8a4b6;font-weight:400;letter-spacing:0}.workbench-link{position:relative;z-index:2;border-radius:24px;padding:11px 17px;background:#ffffff05}#glass-nav{position:absolute;top:5px;left:50%;width:min(700px,55vw);height:330px;transform:translateX(-50%);pointer-events:none}#nav-fallback{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:24px;font-size:14px;color:#d8d3e1;white-space:nowrap}.selection{position:relative;z-index:2;padding:4px 0 10px}.collection-note{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#a8a4b6}.collection-note #play-state{color:#c8b99f;font-size:11px}.song h1{font-size:22px}.song img{width:40px;height:40px}.action{padding:11px 20px;border-radius:23px}.workbench-link:hover{background:#ffffff10}@media(max-width:1000px){.brand span{display:none}#glass-nav{width:60vw}.workbench-link{font-size:12px;padding:10px 12px}}@media(max-width:650px){.shell{grid-template-rows:106px 64px minmax(300px,1fr);padding:10px 14px 14px}header{align-items:flex-start;padding-top:6px}.brand{padding:8px 0}.brand span{display:inline;font-size:11px}#glass-nav{top:51px;width:calc(100vw - 28px)}#nav-fallback{top:67px}.collection-note{display:none}.song h1{font-size:19px}.selection{padding-bottom:8px}.action{padding:11px 15px}}

header{text-shadow:0 1px 5px #000,0 0 16px #000a}
/* The tunnel continues behind navigation, giving the optical glass a real backdrop. */
#stage{position:absolute;inset:0;min-height:0;z-index:0}.shell{isolation:isolate}.selection{pointer-events:none}.selection a{pointer-events:auto}.collection-note,.song{filter:drop-shadow(0 1px 4px #000a)}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body><div class="shell">
<header><div class="brand">弦库<span>封面漫游</span></div><div id="glass-nav"></div><nav id="nav-fallback" aria-label="漫游导航"><span>曲库范围</span><span>漫游操作</span><a href="../">工作台</a></nav><a class="workbench-link" href="../"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="15" rx="2"/><path d="M3 9h18M9 9v10"/></svg>快速进入工作台</a></header>
<div class="toolbar" aria-label="漫游曲目范围" hidden>
<button data-filter="all" aria-pressed="true">全部</button><button data-filter="learning" aria-pressed="false">新学</button><button data-filter="known" aria-pressed="false">拿手歌</button><button data-filter="stale" aria-pressed="false">很久没弹</button>
<span class="spacer"></span><button id="batch">换一组</button><button id="pause" aria-pressed="false">暂停</button>
</div>
<section class="selection" aria-label="当前选中歌曲"><div class="collection-note"><span id="count"></span><span id="play-state">漫游中</span></div><a class="song" id="song-link" href="../" aria-label="打开选中歌曲的曲谱"><img id="cover" alt="" hidden><div aria-live="polite" aria-atomic="true"><h1 id="title">选择一张封面</h1><p id="artist">听过的旋律，再弹一次。</p></div></a><a class="action" id="open" href="../">打开曲谱</a></section>
<main id="stage" aria-label="专辑封面三维隧道"><div id="status" role="status">正在准备你的封面隧道…</div><div id="tunnel"></div></main>
</div><script type="module" src="./preview.js?v=live-glass-2"></script></body></html>
