<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>弦库 · 封面漫游</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#101119;color:#f6f2ed}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,a{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none}::selection{background:#e8d7b855;color:#fff}
.shell{height:100dvh;min-height:620px;display:grid;grid-template-rows:70px 58px minmax(300px,1fr);max-width:1800px;margin:auto;padding:16px 36px 18px;position:relative;isolation:isolate}
header{position:relative;z-index:8;display:flex;justify-content:space-between;align-items:center;gap:24px}
.brand{display:grid;gap:8px;white-space:nowrap;text-shadow:0 1px 6px #000c}.brand-line{display:flex;align-items:baseline;gap:14px}.wordmark{font-size:24px;font-weight:750;letter-spacing:3px;line-height:1.15}.brand-context{font-size:12px;font-weight:450;letter-spacing:1px;color:#e4dfe9}.collection-note{display:flex;align-items:center;gap:12px;font-size:11px;font-variant-numeric:tabular-nums;color:#bcb7c6}.collection-note #play-state{display:flex;align-items:center;gap:6px;padding-left:12px;border-left:1px solid #ffffff28;color:#e1d6c2}.collection-note #play-state[data-paused=true]::before{background:#a8a4b2}.collection-note #play-state::before{content:"";width:4px;height:4px;border-radius:50%;background:#dec99d;flex-shrink:0}
.header-actions{display:flex;align-items:center;gap:10px;position:relative;z-index:2}.header-actions a{height:44px;display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:13px;padding:0 17px;font-size:13px;font-weight:550;white-space:nowrap;transition:background 140ms,border-color 140ms,transform 100ms}
.header-actions svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.workbench-link{border:1px solid #ffffff2b;background:#14172366;color:#eeeaf3;backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 #ffffff16;text-shadow:0 1px 4px #0009}.workbench-link:hover{background:#ffffff19;border-color:#ffffff55}
.action{border:1px solid #fff6e5b0;background:linear-gradient(145deg,#fff7e8f5,#e6d6bde8);color:#2c2621;box-shadow:inset 0 1px 0 #ffffffcc,0 4px 16px #0002;text-shadow:none}.action:hover{background:linear-gradient(145deg,#fffaf2,#f0e1cc)}.header-actions a:active{transform:translateY(1px)}
#glass-nav{position:absolute;top:7px;left:50%;width:min(700px,55vw);height:330px;transform:translateX(-50%);pointer-events:none}#nav-fallback{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:24px;font-size:14px;color:#d8d3e1;white-space:nowrap}
.toolbar{display:flex;align-items:center;gap:7px;padding:12px 0;flex-wrap:wrap}.toolbar button{background:#151927;border:1px solid #393842;border-radius:8px;padding:8px 16px;font-size:13px}.toolbar button[aria-pressed=true]{color:#f5d1a9}.spacer{flex:1}
.selection{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:0 0 10px}.song{display:flex;gap:12px;align-items:center;min-width:0;max-width:70%;pointer-events:auto;color:inherit;filter:drop-shadow(0 1px 4px #000a)}.song:hover h1{color:#f5d1a9}.song img{width:40px;height:40px;object-fit:cover;border-radius:6px}.song h1{font-size:22px;margin:0 0 5px;font-weight:650;line-height:1.3;overflow-wrap:anywhere}.song p{font-size:13px;color:#c4bdce;margin:0}
#stage{position:absolute;inset:0;min-height:0;z-index:0;overflow:hidden;border-radius:16px;background:#101119}#status{position:absolute;inset:0;display:grid;place-content:center;pointer-events:none;color:#aca2b8;font-size:14px;z-index:2}
button:focus-visible,a:focus-visible{outline:2px solid #f5d1a9;outline-offset:4px}@media(prefers-reduced-motion:reduce){.header-actions a{transition:none}}
@media(max-width:1100px){.shell{padding-inline:24px}.brand-context{display:none}.header-actions{gap:7px}.header-actions a{padding-inline:12px}.collection-note{gap:8px;font-size:11px}.collection-note #play-state{padding-left:8px}}
@media(max-width:800px){.collection-note #count{display:none}.collection-note #play-state{padding-left:0;border:0}.header-actions a{padding-inline:10px;gap:6px}#glass-nav{width:56vw}.header-actions .workbench-link svg{display:none}}
@media(max-width:900px){.shell{grid-template-rows:118px 58px minmax(300px,1fr);padding:10px 14px 14px;min-height:560px}header{align-items:flex-start;gap:12px;padding-top:6px}.brand{gap:6px;padding-top:2px}.wordmark{font-size:22px;letter-spacing:2px}.collection-note{font-size:11px}.header-actions{gap:7px}.header-actions a{height:40px;font-size:12px;padding-inline:12px;border-radius:12px}.header-actions svg{width:14px;height:14px}.header-actions .workbench-link svg{display:block}#glass-nav{top:63px;width:calc(100vw - 28px)}#nav-fallback{top:78px}.song{max-width:100%;gap:10px}.song h1{font-size:19px}.song img{width:38px;height:38px}.selection{padding-bottom:8px}}
#first-frame{position:absolute;z-index:1;pointer-events:none;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6;mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
#cover-reader{position:fixed;inset:0;z-index:100;background:#fbf6f0}#cover-reader iframe{position:absolute;inset:0;width:100%;height:100%;border:0;visibility:hidden}.reader-ready iframe{visibility:visible!important}.reader-ready .reader-pending{display:none}.reader-pending{height:100%;overflow:auto;background:#f7f2ea;color:#252323}.reader-pending>div{height:66px;display:flex;align-items:center;gap:24px;padding:12px 24px}.reader-pending button{background:white;color:#444;border:1px solid #ded6cd;border-radius:8px;padding:10px 15px}.reader-pending img{display:block;max-width:calc(100% - 32px);max-height:calc(100dvh - 80px);width:auto;height:auto;margin:0 auto;object-fit:contain}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body><div class="shell">
<header><div class="brand"><div class="brand-line"><span class="wordmark">弦库</span><span class="brand-context">封面漫游</span></div><div class="collection-note"><span id="count"></span><span id="play-state">漫游中</span></div></div><div id="glass-nav"></div><nav id="nav-fallback" aria-label="漫游导航"><span>曲库范围</span><span>漫游操作</span><a href="../workbench.html">工作台</a></nav><div class="header-actions"><a class="workbench-link" href="../workbench.html" aria-label="快速进入工作台" title="快速进入工作台"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="15" rx="2"/><path d="M3 9h18M9 9v10"/></svg>工作台</a><a class="action" id="open" href="../workbench.html"><span id="open-label">打开曲谱</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></a></div></header>
<div class="toolbar" aria-label="漫游曲目范围" hidden>
<button data-filter="all" aria-pressed="true">全部</button><button data-filter="learning" aria-pressed="false">新学</button><button data-filter="known" aria-pressed="false">拿手歌</button><button data-filter="stale" aria-pressed="false">很久没弹</button>
<span class="spacer"></span><button id="batch">换一组</button><button id="pause" aria-pressed="false">暂停</button>
</div>
<section class="selection" aria-label="当前选中歌曲"><a class="song" id="song-link" href="../workbench.html" aria-label="打开选中歌曲的曲谱"><img id="cover" alt="" hidden><div aria-live="polite" aria-atomic="true"><h1 id="title">选择一张封面</h1><p id="artist">听过的旋律，再弹一次。</p></div></a></section>
<main id="stage" aria-label="专辑封面三维隧道"><img id="first-frame" src="./first-frame.webp" alt="曲库封面" fetchpriority="high"><div id="status" role="status">正在准备你的封面隧道…</div><div id="tunnel"></div></main>
</div><script type="module" src="./preview.js?v=fast-1"></script></body></html>
