name: Deploy guitar workbench

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore packaged score library
        shell: bash
        run: |
          cat packed/site-assets.tar.part-* > packed/site-assets.tar
          tar -xf packed/site-assets.tar
          cat packed/workbuddy-assets.tar.part-* > packed/workbuddy-assets.tar
          tar -xf packed/workbuddy-assets.tar
          cat packed/fast-library.tar.part-* > packed/fast-library.tar
          tar -xf packed/fast-library.tar
      - name: Build WorkBuddy application
        run: python3 workbuddy/source/build.py
      - name: Build and validate static PWA
        run: npm run build:pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: pages-dist
      - name: Wait for Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        shell: bash
        run: |
          for attempt in {1..15}; do
            if gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                 -f name="$PAGES_ARTIFACT" --jq '.artifacts[].id' | grep -Fxq "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::GitHub Actions did not index the uploaded Pages artifact in time."
          exit 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
